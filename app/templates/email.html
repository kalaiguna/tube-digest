<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Deep-Dive Summary</title>
  <!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
  <style>
    /* Reset */
    body, table, td, a {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Helvetica Neue', Arial, sans-serif;
      color: #1a1a1a;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
      margin: 24px auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #c62828 0%, #8b0000 100%);
      padding: 32px 36px;
      color: #fff;
    }
    .header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header .subtitle {
      margin: 0;
      font-size: 13px;
      opacity: 0.80;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Body ───────────────────────────────────── */
    .body {
      background: #ffffff;
      padding: 32px 36px;
    }

    .section { margin-bottom: 32px; }
    .section:last-child { margin-bottom: 0; }

    .section-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: #c62828;
      margin-bottom: 10px;
    }

    /* TL;DR card */
    .tldr-card {
      background: #fff8f8;
      border-left: 4px solid #c62828;
      border-radius: 0 6px 6px 0;
      padding: 16px 20px;
      font-size: 15px;
      line-height: 1.7;
      color: #2d2d2d;
    }

    /* Deep Dive */
    .deep-dive {
      font-size: 15px;
      line-height: 1.85;
      color: #3a3a3a;
      white-space: pre-wrap;
    }

    /* Diagram */
    .diagram-box {
      text-align: center;
      background: #fafafa;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 20px;
    }
    .diagram-box img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    /* ── Footer ─────────────────────────────────── */
    .footer {
      background: #f9f9f9;
      border-top: 1px solid #e8e8e8;
      padding: 18px 36px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    .footer a {
      color: #c62828;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- Header -->
    <div class="header">
      <h1>YouTube Deep-Dive Summary</h1>
      {% if video_title %}
        <p class="subtitle">{{ video_title }}</p>
      {% endif %}
    </div>

    <!-- Body -->
    <div class="body">

      <!-- TL;DR -->
      <div class="section">
        <span class="section-label">TL;DR</span>
        <div class="tldr-card">{{ tldr }}</div>
      </div>

      <!-- Deep Dive -->
      <div class="section">
        <span class="section-label">Deep Dive</span>
        <div class="deep-dive">{{ deep_dive }}</div>
      </div>

      <!-- Visual Map -->
      {% if diagram_data_uri %}
      <div class="section">
        <span class="section-label">Visual Map</span>
        <div class="diagram-box">
          <img src="{{ diagram_data_uri }}" alt="Concept Visual Map">
        </div>
      </div>
      {% endif %}

    </div><!-- /body -->

    <!-- Footer -->
    <div class="footer">
      Generated by the YouTube Deep-Dive Knowledge Engine &bull;
      <a href="{{ video_url }}">Watch Original Video</a>
    </div>

  </div><!-- /wrapper -->
</body>
</html>
